<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Employees - EMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Employees</span>
  <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
</nav>

<div class="container mt-4">
  <div sec:authorize="hasAnyRole('ADMIN','MANAGER')" class="mb-3">
    <a th:href="@{/employees/new}" class="btn btn-success">+ Add Employee</a>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
    <tr>
      <th>Name</th><th>Email</th><th>Department</th><th>Position</th><th>Salary</th>
      <th sec:authorize="hasAnyRole('ADMIN','MANAGER')">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employees}">
      <td th:text="${emp.fullName}"></td>
      <td th:text="${emp.email}"></td>
      <td th:text="${emp.department}"></td>
      <td th:text="${emp.position}"></td>
      <td th:text="${emp.salary}"></td>
      <td sec:authorize="hasAnyRole('ADMIN','MANAGER')">
        <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-warning">Edit</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/employees/delete/{id}(id=${emp.id})}"
           class="btn btn-sm btn-danger" onclick="return confirm('Delete this employee?')">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
