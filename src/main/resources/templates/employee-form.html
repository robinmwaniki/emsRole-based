<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width:500px;">
    <h3 th:text="${employee.id} != null ? 'Edit Employee' : 'Add Employee'"></h3>
    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-2">
            <label class="form-label">Full Name</label>
            <input class="form-control" th:field="*{fullName}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Department</label>
            <input class="form-control" th:field="*{department}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Position</label>
            <input class="form-control" th:field="*{position}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Salary</label>
            <input class="form-control" type="number" step="0.01" th:field="*{salary}">
        </div>
        <button class="btn btn-primary mt-2" type="submit">Save</button>
        <a th:href="@{/employees}" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
