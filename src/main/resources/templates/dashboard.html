<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">EMS Dashboard</span>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-light btn-sm">Logout</button>
    </form>
</nav>

<div class="container mt-4">
    <p>Logged in as: <strong sec:authentication="name"></strong>
        (<span sec:authentication="principal.authorities"></span>)</p>

    <a th:href="@{/employees}" class="btn btn-primary">View Employees</a>

    <div sec:authorize="hasAnyRole('ADMIN','MANAGER')" class="mt-3">
        <a th:href="@{/employees/new}" class="btn btn-success">Add Employee</a>
    </div>

    <div sec:authorize="hasRole('ADMIN')" class="mt-3">
        <p class="text-muted">You have admin privileges: you can delete employee records.</p>
    </div>
</div>
</body>
</html>
